name: Windows VST3 and DSP tests
on:
  push:
    branches: [ main, "development/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: smartgate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-dsp-sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Configure portable DSP tests with Clang sanitizers
        run: >-
          cmake -S . -B build-sanitized
          -DSMARTGATE_BUILD_PLUGIN=OFF
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build portable DSP tests
        run: cmake --build build-sanitized --parallel 2
      - name: Run DSP tests under AddressSanitizer and UBSan
        run: ctest --test-dir build-sanitized --output-on-failure

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - name: Configure (retry transient dependency downloads)
        shell: pwsh
        run: |
          $configureArgs = @(
            "-S", ".", "-B", "build", "-A", "x64",
            "-DSMARTGATE_BUILD_PLUGIN=ON",
            "-DCMAKE_CXX_FLAGS_RELEASE=/O2 /Ob2 /DNDEBUG /Zi",
            "-DCMAKE_SHARED_LINKER_FLAGS_RELEASE=/DEBUG:FULL",
            "-DCMAKE_MODULE_LINKER_FLAGS_RELEASE=/DEBUG:FULL",
            "-DCMAKE_EXE_LINKER_FLAGS_RELEASE=/DEBUG:FULL"
          )

          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Host "CMake configure attempt $attempt of 3"
            & cmake @configureArgs
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }

            if ($attempt -lt 3) {
              $delay = 15 * $attempt
              Write-Warning "CMake configure failed (exit $LASTEXITCODE); retrying in $delay seconds. This also retries transient ONNX Runtime/Silero download failures."
              Start-Sleep -Seconds $delay
            }
          }

          throw "CMake configure failed after 3 attempts."
      - name: Build VST3 and tests
        id: build_vst3
        run: cmake --build build --config Release --parallel 2
      - name: Run DSP tests
        run: ctest --test-dir build -C Release --output-on-failure --verbose
      - name: Run processor state integration tests
        run: .\\build\\Release\\SmartGateProcessorStateTests.exe
      - name: Measure Silero ONNX inference latency
        run: .\\build\\Release\\SmartGateSileroTests.exe
      - name: Measure DSP CPU budget
        run: .\\build\\Release\\SmartGateDspBenchmark.exe
      - name: Measure full processor CPU budget
        run: .\\build\\Release\\SmartGateProcessorBenchmark.exe
      - name: Verify VST3 bundle dependencies
        id: verify_bundle
        shell: pwsh
        run: |
          $bundle = Get-ChildItem "build/SmartGate_artefacts/Release/VST3" -Directory -Filter "*.vst3" | Select-Object -First 1
          if (-not $bundle) { throw "VST3 bundle was not produced." }

          $module = Join-Path $bundle.FullName "Contents/x86_64-win/Smart Gate.vst3"
          $moduleDir = Split-Path $module -Parent
          $runtime = Join-Path $moduleDir "onnxruntime.dll"
          $sharedProvider = Join-Path $moduleDir "onnxruntime_providers_shared.dll"
          $notices = Join-Path $bundle.FullName "Contents/Resources/THIRD_PARTY_NOTICES.txt"

          foreach ($requiredFile in @($module, $runtime, $sharedProvider, $notices)) {
            if (-not (Test-Path -LiteralPath $requiredFile -PathType Leaf)) {
              throw "Required VST3 bundle file is missing: $requiredFile"
            }
            if ((Get-Item -LiteralPath $requiredFile).Length -le 0) {
              throw "Required VST3 bundle file is empty: $requiredFile"
            }
          }

          Write-Host "VST3 module, ONNX Runtime, shared provider DLL, and third-party notices are present."
      - name: Validate VST3 with pluginval
        shell: pwsh
        run: |
          function Get-DownloadWithRetry {
            param(
              [Parameter(Mandatory = $true)][string]$Uri,
              [Parameter(Mandatory = $true)][string]$Destination,
              [int]$MaxAttempts = 5,
              [hashtable]$Headers = @{}
            )

            for ($attempt = 1; $attempt -le $MaxAttempts; $attempt++) {
              try {
                if (Test-Path -LiteralPath $Destination) {
                  Remove-Item -LiteralPath $Destination -Force
                }
                Write-Host "Downloading $Uri (attempt $attempt/$MaxAttempts)"
                if ($Headers.Count -gt 0) {
                  Invoke-WebRequest -Uri $Uri -Headers $Headers -OutFile $Destination -TimeoutSec 180
                } else {
                  Invoke-WebRequest -Uri $Uri -OutFile $Destination -TimeoutSec 180
                }
                if (-not (Test-Path -LiteralPath $Destination -PathType Leaf) -or
                    (Get-Item -LiteralPath $Destination).Length -le 0) {
                  throw "Download produced a missing or empty file."
                }
                return
              }
              catch {
                if ($attempt -eq $MaxAttempts) {
                  throw "Download failed after $MaxAttempts attempts: $Uri. Last error: $($_.Exception.Message)"
                }
                $delay = [Math]::Min(30, 10 * [Math]::Pow(2, $attempt - 1))
                Write-Warning "Download attempt $attempt failed: $($_.Exception.Message). Retrying in $delay seconds."
                Start-Sleep -Seconds $delay
              }
            }
          }

          $archive = Join-Path $env:RUNNER_TEMP "pluginval_Windows.zip"
          $tools = Join-Path $env:RUNNER_TEMP "pluginval"
          $pluginvalSha256 = "c08e61ce3b96db41636f8ec7e76f4c7e2c13ebdac7fa1b5a1f52b4f32ec715ab"
          try {
            Get-DownloadWithRetry -Uri "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip" -Destination $archive -MaxAttempts 2
          }
          catch {
            Write-Warning "Primary pluginval release URL failed; trying the GitHub release asset API endpoint."
            Get-DownloadWithRetry -Uri "https://api.github.com/repos/Tracktion/pluginval/releases/assets/210999198" -Destination $archive -MaxAttempts 2 -Headers @{
              Accept = "application/octet-stream"
              "X-GitHub-Api-Version" = "2022-11-28"
            }
          }

          $actualPluginvalSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualPluginvalSha256 -ne $pluginvalSha256) {
            throw "pluginval v1.0.4 SHA256 mismatch: expected $pluginvalSha256, got $actualPluginvalSha256"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $tools -Force

          $validator = Get-ChildItem -LiteralPath $tools -Filter "pluginval.exe" -File -Recurse | Select-Object -First 1
          if (-not $validator) { throw "Pinned pluginval v1.0.4 executable was not found in its release archive." }

          # Each GitHub Actions step runs in a separate PowerShell process.
          # Resolve the module path again instead of relying on a prior step's variable.
          $bundle = Get-ChildItem "build/SmartGate_artefacts/Release/VST3" -Directory -Filter "*.vst3" | Select-Object -First 1
          if (-not $bundle) { throw "Built Smart Gate VST3 bundle is missing." }
          $module = Join-Path $bundle.FullName "Contents/x86_64-win/Smart Gate.vst3"
          if (-not (Test-Path -LiteralPath $module -PathType Leaf)) {
            throw "Built Smart Gate VST3 module is missing: $module"
          }

          # Crash-dump capture is optional diagnostics. Do not make VST3 validation
          # depend on downloading Sysinternals from a second external host: that
          # download can stall the entire Windows job before pluginval even starts.
          # pluginval's own exit code remains the authoritative validation result.
          $dumpDir = Join-Path $env:RUNNER_TEMP "pluginval-dumps"
          New-Item -ItemType Directory -Path $dumpDir -Force | Out-Null

          # Capture the native process result explicitly and retain its output for diagnostics.
          $stdoutLog = Join-Path $env:RUNNER_TEMP "pluginval-stdout.log"
          $stderrLog = Join-Path $env:RUNNER_TEMP "pluginval-stderr.log"
          $argumentList = '--strictness-level 5 --skip-gui-tests "' + $module + '"'
          $pluginvalProcess = Start-Process -FilePath $validator.FullName -ArgumentList $argumentList -Wait -PassThru -NoNewWindow -RedirectStandardOutput $stdoutLog -RedirectStandardError $stderrLog
          $pluginvalExitCode = $pluginvalProcess.ExitCode

          if (Test-Path -LiteralPath $stdoutLog) { Get-Content -LiteralPath $stdoutLog }
          if (Test-Path -LiteralPath $stderrLog) { Get-Content -LiteralPath $stderrLog }

          Write-Host "pluginval process exit code: $pluginvalExitCode"
          if ($pluginvalExitCode -ne 0) {
            throw "pluginval rejected or crashed while validating Smart Gate VST3 (exit code $pluginvalExitCode)."
          }
      - name: Analyze pluginval crash dump
        if: always()
        shell: pwsh
        run: |
          $dump = Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP "pluginval-dumps") -Filter "*.dmp" -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dump) {
            Write-Host "No pluginval crash dump was produced; skipping dump analysis."
            exit 0
          }

          $analysis = Join-Path $env:RUNNER_TEMP "pluginval-dump-analysis.txt"
          $debugger = Get-ChildItem "C:\Program Files (x86)\Windows Kits" -Filter "cdb.exe" -File -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "\\Debuggers\\x64\\cdb\\.exe$" } | Select-Object -First 1
          if (-not $debugger) {
            "CDB debugger was not found on this runner. Dump retained for offline analysis: $($dump.FullName)" | Set-Content -LiteralPath $analysis
            exit 0
          }

          $pdbDirectories = Get-ChildItem -LiteralPath "build" -Filter "*.pdb" -File -Recurse -ErrorAction SilentlyContinue | ForEach-Object { $_.DirectoryName } | Sort-Object -Unique
          $symbolPath = (@($pdbDirectories) + @("srv*$env:RUNNER_TEMP\\symbols*https://msdl.microsoft.com/download/symbols")) -join ";"
          "Dump: $($dump.FullName)" | Set-Content -LiteralPath $analysis
          "Debugger: $($debugger.FullName)" | Add-Content -LiteralPath $analysis
          "Symbol path: $symbolPath" | Add-Content -LiteralPath $analysis
          & $debugger.FullName -z $dump.FullName -y $symbolPath -c "!analyze -v; .ecxr; kv; lm; q" 2>&1 | Add-Content -LiteralPath $analysis
          Write-Host "Crash dump analysis written to $analysis"

      - name: Stage pluginval symbols only when a crash dump exists
        if: always()
        shell: pwsh
        run: |
          $dump = Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP "pluginval-dumps") -Filter "*.dmp" -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dump) {
            Write-Host "No crash dump; skipping PDB artifact staging."
            exit 0
          }

          $symbolRoot = Join-Path $env:RUNNER_TEMP "pluginval-symbols"
          $buildRoot = (Resolve-Path -LiteralPath "build").Path
          Get-ChildItem -LiteralPath $buildRoot -Filter "*.pdb" -File -Recurse | ForEach-Object {
            $relativePath = [System.IO.Path]::GetRelativePath($buildRoot, $_.FullName)
            $destination = Join-Path $symbolRoot $relativePath
            $destinationDirectory = Split-Path -Parent $destination
            New-Item -ItemType Directory -Path $destinationDirectory -Force | Out-Null
            Copy-Item -LiteralPath $_.FullName -Destination $destination -Force
          }

      - name: Upload pluginval crash diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: SmartGate-pluginval-crash-diagnostics
          path: |
            ${{ runner.temp }}/pluginval-dumps/*.dmp
            ${{ runner.temp }}/pluginval-stdout.log
            ${{ runner.temp }}/pluginval-stderr.log
            ${{ runner.temp }}/pluginval-dump-analysis.txt
            ${{ runner.temp }}/pluginval-symbols/**/*.pdb
          if-no-files-found: ignore

      - name: Stage distributable VST3 bundle
        id: stage_vst3
        if: ${{ always() && steps.build_vst3.outcome == 'success' && steps.verify_bundle.outcome == 'success' }}
        shell: pwsh
        run: |
          $bundle = Get-ChildItem "build/SmartGate_artefacts/Release/VST3" -Directory -Filter "*.vst3" | Select-Object -First 1
          if (-not $bundle) { throw "VST3 bundle was not produced." }

          $stage = Join-Path $env:RUNNER_TEMP "SmartGate-VST3"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -LiteralPath $bundle.FullName -Destination $stage -Recurse -Force

          Write-Host "Staged distributable bundle: $(Join-Path $stage $bundle.Name)"

      - name: Upload VST3
        if: ${{ always() && steps.stage_vst3.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: SmartGate-Windows-x64-VST3
          path: ${{ runner.temp }}/SmartGate-VST3/
          if-no-files-found: error
