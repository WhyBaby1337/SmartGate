name: Windows VST3 and DSP tests
on:
  push:
    branches: [ main, "development/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: smartgate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64 -DSMARTGATE_BUILD_PLUGIN=ON
      - name: Build VST3 and tests
        run: cmake --build build --config Release --parallel 2
      - name: Run DSP tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Measure DSP CPU budget
        run: .\\build\\Release\\SmartGateDspBenchmark.exe
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: SmartGate-Windows-x64-VST3
          path: build/SmartGate_artefacts/Release/VST3/
          if-no-files-found: error
